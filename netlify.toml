[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[dev]
  command = "npm run dev"
  port = 3000

[[redirects]]
  from = "/it"
  to = "/it/"
  status = 301

[[redirects]]
  from = "/de"
  to = "/de/"
  status = 301

[[redirects]]
  from = "/risorse"
  to = "/risorse/"
  status = 301

[[redirects]]
  from = "/de/ressourcen"
  to = "/de/ressourcen/"
  status = 301

# Nessun catch-all verso /index.html: le uniche rotte del sito sono /, /it/, /de/, /risorse/ e /de/ressourcen/,
# tutte file statici. Gli indirizzi inesistenti ricevono dist/404.html con stato 404
# (vedi DECISIONS.md, "Pagina 404 vera al posto del catch-all SPA").
